<!DOCTYPE html>

<html>

<head>

<title>
Products | Barcode Studio Pro
</title>


<link rel="stylesheet" href="CSS/index.css">

<link rel="stylesheet" href="CSS/products.css">

</head>


<body>


<div class="product-container">


<div class="product-form card">


<h2>
Add Product
</h2>



<label>
Product Name
</label>

<input id="productName"
placeholder="Example: Coca Cola 500ml">



<label>
SKU
</label>

<input id="sku"
placeholder="SKU001">



<label>
Category
</label>

<input id="category"
placeholder="Beverages">



<label>
Brand
</label>

<input id="brand"
placeholder="Coca Cola">



<label>
Barcode Number
</label>

<input id="barcode"
placeholder="123456789">



<label>
Barcode Type
</label>


<select id="barcodeType">


<option value="CODE128">
Code 128
</option>


<option value="EAN13">
EAN-13
</option>


<option value="UPC">
UPC-A
</option>


<option value="CODE39">
Code 39
</option>


</select>




<label>
Selling Price
</label>

<input 
type="number"
id="price"
placeholder="0.00">



<label>
Quantity
</label>

<input
type="number"
id="quantity"
value="0">



<button id="saveProduct">

Save Product

</button>


</div>




<div class="product-list card">


<h2>
Products
</h2>


<input 
id="productSearch"
placeholder="Search products...">


<table>


<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Barcode</th>

<th>Price</th>

<th>Action</th>


</tr>


</thead>


<tbody id="productTable">


</tbody>


</table>



</div>


</div>



<script src="JS/storage.js"></script>

<script src="JS/products.js"></script>


</body>

</html>
